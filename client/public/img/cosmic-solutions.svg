<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="base" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#0f0f30"/>
      <stop offset="60%" stop-color="#090920"/>
      <stop offset="100%" stop-color="#03030a"/>
    </radialGradient>
    <radialGradient id="hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <ellipse cx="1280" cy="200" rx="520" ry="380" fill="url(#glowV)"/>
  <ellipse cx="260" cy="740" rx="480" ry="360" fill="url(#glowC)"/>

  <!-- faint grid -->
  <g stroke="#6366f1" stroke-opacity="0.07">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- commerce network: outer nodes funnel into the hub, hub emits to the sale point -->
  <g stroke-linecap="round" fill="none">
    <path d="M220 170 Q 500 260 790 452" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M180 450 Q 480 440 790 455" stroke="#8b5cf6" stroke-opacity="0.42" stroke-width="2"/>
    <path d="M250 730 Q 520 640 792 462" stroke="#67e8f9" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M560 120 Q 690 280 798 448" stroke="#a78bfa" stroke-opacity="0.38" stroke-width="1.6"/>
    <path d="M540 800 Q 670 650 796 466" stroke="#22d3ee" stroke-opacity="0.34" stroke-width="1.6"/>
    <path d="M806 456 Q 1090 420 1330 300" stroke="#c4b5fd" stroke-opacity="0.65" stroke-width="2.6"/>
    <path d="M806 460 Q 1100 500 1352 620" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2.2"/>
  </g>

  <!-- source nodes (creators/channels) -->
  <g>
    <circle cx="220" cy="170" r="26" fill="#140f2e" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="220" cy="170" r="9" fill="#a78bfa"/>
    <circle cx="180" cy="450" r="22" fill="#140f2e" stroke="#7c3aed" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="180" cy="450" r="8" fill="#8b5cf6"/>
    <circle cx="250" cy="730" r="24" fill="#0e1b2e" stroke="#06b6d4" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="250" cy="730" r="8" fill="#22d3ee"/>
    <circle cx="560" cy="120" r="17" fill="#140f2e" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.6"/>
    <circle cx="560" cy="120" r="6" fill="#c4b5fd"/>
    <circle cx="540" cy="800" r="17" fill="#0e1b2e" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.6"/>
    <circle cx="540" cy="800" r="6" fill="#67e8f9"/>
  </g>

  <!-- packets travelling along the funnel -->
  <g>
    <circle cx="505" cy="268" r="4.5" fill="#e9d5ff"/>
    <circle cx="500" cy="443" r="4" fill="#ddd6fe"/>
    <circle cx="530" cy="636" r="4.5" fill="#a5f3fc"/>
    <circle cx="1080" cy="424" r="5" fill="#ede9fe"/>
    <circle cx="1105" cy="502" r="4.5" fill="#cffafe"/>
  </g>

  <!-- central hub -->
  <circle cx="800" cy="458" r="150" fill="url(#hub)" opacity="0.55"/>
  <circle cx="800" cy="458" r="52" fill="#13102d" stroke="#c4b5fd" stroke-opacity="0.9" stroke-width="2.5"/>
  <circle cx="800" cy="458" r="20" fill="#a78bfa"/>
  <circle cx="800" cy="458" r="78" fill="none" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 10"/>

  <!-- destination: conversion nodes -->
  <g>
    <circle cx="1330" cy="300" r="30" fill="#140f2e" stroke="#c4b5fd" stroke-opacity="0.85" stroke-width="2.5"/>
    <circle cx="1330" cy="300" r="11" fill="#e9d5ff"/>
    <circle cx="1352" cy="620" r="25" fill="#0e1b2e" stroke="#67e8f9" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="1352" cy="620" r="9" fill="#a5f3fc"/>
  </g>

  <!-- sparse stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="90" r="1.4" opacity="0.6"/><circle cx="700" cy="60" r="1.3" opacity="0.5"/>
    <circle cx="1020" cy="130" r="1.5" opacity="0.6"/><circle cx="1500" cy="110" r="1.3" opacity="0.55"/>
    <circle cx="1540" cy="820" r="1.4" opacity="0.5"/><circle cx="1000" cy="820" r="1.3" opacity="0.5"/>
    <circle cx="120" cy="860" r="1.2" opacity="0.45"/><circle cx="1470" cy="460" r="1.5" opacity="0.6"/>
  </g>
</svg>
