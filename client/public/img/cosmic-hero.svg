<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="base" cx="65%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#101033"/>
      <stop offset="45%" stop-color="#090920"/>
      <stop offset="100%" stop-color="#03030a"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#5b21b6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0e7490" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="45%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- nebula glows -->
  <ellipse cx="1430" cy="260" rx="760" ry="520" fill="url(#violet)"/>
  <ellipse cx="300" cy="900" rx="640" ry="430" fill="url(#cyan)"/>
  <ellipse cx="1750" cy="820" rx="420" ry="360" fill="url(#indigo)"/>

  <!-- orbit rings around the planet, slightly tilted -->
  <g transform="translate(1430 300) rotate(-16)">
    <ellipse rx="330" ry="110" fill="none" stroke="#8b7bd8" stroke-opacity="0.35" stroke-width="2"/>
    <ellipse rx="450" ry="152" fill="none" stroke="#8b7bd8" stroke-opacity="0.22" stroke-width="1.5"/>
    <ellipse rx="585" ry="200" fill="none" stroke="#67e8f9" stroke-opacity="0.14" stroke-width="1.5"/>
    <!-- satellites on the rings -->
    <circle cx="-312" cy="36" r="7" fill="#67e8f9" opacity="0.9"/>
    <circle cx="430" cy="-48" r="5" fill="#c4b5fd" opacity="0.9"/>
    <circle cx="150" cy="190" r="4" fill="#e9d5ff" opacity="0.8"/>
  </g>

  <!-- planet -->
  <circle cx="1430" cy="300" r="150" fill="url(#planet)"/>
  <!-- bright limb on the planet -->
  <ellipse cx="1377" cy="243" rx="96" ry="76" fill="#d8b4fe" opacity="0.25"/>

  <!-- horizon glow arc at the bottom -->
  <ellipse cx="960" cy="1385" rx="1250" ry="420" fill="#0d0d2b"/>
  <ellipse cx="960" cy="1388" rx="1250" ry="420" fill="none" stroke="url(#horizon)" stroke-width="3" opacity="0.8"/>
  <ellipse cx="960" cy="1400" rx="1250" ry="420" fill="none" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="22" filter="blur(0px)"/>

  <!-- shooting star -->
  <line x1="320" y1="150" x2="520" y2="230" stroke="#e9d5ff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
  <circle cx="520" cy="230" r="3.5" fill="#f5f3ff"/>

  <!-- star field -->
  <g fill="#ffffff">
    <circle cx="120" cy="140" r="1.6" opacity="0.8"/><circle cx="260" cy="420" r="1.2" opacity="0.5"/>
    <circle cx="420" cy="90" r="1.4" opacity="0.7"/><circle cx="540" cy="330" r="1.1" opacity="0.45"/>
    <circle cx="700" cy="180" r="1.8" opacity="0.85"/><circle cx="860" cy="60" r="1.2" opacity="0.5"/>
    <circle cx="980" cy="290" r="1.5" opacity="0.7"/><circle cx="1120" cy="120" r="1.2" opacity="0.55"/>
    <circle cx="1300" cy="520" r="1.4" opacity="0.6"/><circle cx="1600" cy="640" r="1.6" opacity="0.7"/>
    <circle cx="1760" cy="180" r="1.3" opacity="0.6"/><circle cx="1860" cy="420" r="1.5" opacity="0.7"/>
    <circle cx="80" cy="640" r="1.4" opacity="0.6"/><circle cx="230" cy="760" r="1.2" opacity="0.5"/>
    <circle cx="500" cy="580" r="1.5" opacity="0.65"/><circle cx="640" cy="760" r="1.1" opacity="0.4"/>
    <circle cx="820" cy="640" r="1.3" opacity="0.55"/><circle cx="1050" cy="720" r="1.6" opacity="0.7"/>
    <circle cx="1240" cy="860" r="1.2" opacity="0.5"/><circle cx="1480" cy="760" r="1.4" opacity="0.6"/>
    <circle cx="1680" cy="920" r="1.2" opacity="0.45"/><circle cx="1840" cy="700" r="1.5" opacity="0.65"/>
    <circle cx="360" cy="950" r="1.3" opacity="0.5"/><circle cx="900" cy="930" r="1.4" opacity="0.6"/>
    <circle cx="1140" cy="470" r="1.2" opacity="0.5"/><circle cx="60" cy="350" r="1.3" opacity="0.55"/>
  </g>
  <!-- a few bigger twinkles -->
  <g fill="#c4b5fd">
    <circle cx="755" cy="105" r="2.6" opacity="0.9"/>
    <circle cx="185" cy="520" r="2.2" opacity="0.8"/>
    <circle cx="1565" cy="95" r="2.4" opacity="0.85"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="1050" cy="170" r="2.2" opacity="0.8"/>
    <circle cx="430" cy="820" r="2.4" opacity="0.75"/>
  </g>
</svg>
