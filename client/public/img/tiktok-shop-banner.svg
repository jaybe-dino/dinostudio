<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <radialGradient id="base" cx="50%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#0b0b24"/>
      <stop offset="60%" stop-color="#070716"/>
      <stop offset="100%" stop-color="#03030a"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#69C9D0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#69C9D0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EE1D52" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#EE1D52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132537"/>
      <stop offset="100%" stop-color="#0b1626"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1424"/>
      <stop offset="100%" stop-color="#160b18"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153043"/>
      <stop offset="55%" stop-color="#1d1535"/>
      <stop offset="100%" stop-color="#2b1030"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#base)"/>
  <ellipse cx="420" cy="180" rx="560" ry="380" fill="url(#cyanGlow)"/>
  <ellipse cx="1240" cy="540" rx="560" ry="380" fill="url(#pinkGlow)"/>

  <!-- duotone light streaks (tiktok-ish motion) -->
  <g stroke-linecap="round" fill="none">
    <path d="M120 540 Q 480 430 860 470 Q 1180 500 1500 380" stroke="#69C9D0" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M100 560 Q 470 455 860 492 Q 1185 522 1505 405" stroke="#EE1D52" stroke-opacity="0.26" stroke-width="3"/>
    <path d="M220 130 Q 620 90 1020 150 Q 1320 194 1540 130" stroke="#69C9D0" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <!-- floating product cards -->
  <g transform="rotate(-6 390 330)">
    <rect x="300" y="240" width="180" height="180" rx="14" fill="url(#cardA)" stroke="#69C9D0" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="322" y="262" width="136" height="88" rx="8" fill="#69C9D0" opacity="0.2"/>
    <rect x="322" y="366" width="96" height="10" rx="5" fill="#9bdfe4" opacity="0.7"/>
    <rect x="322" y="386" width="60" height="10" rx="5" fill="#69C9D0" opacity="0.5"/>
    <circle cx="442" cy="388" r="15" fill="#69C9D0" opacity="0.85"/>
    <path d="M436 388 l5 5 l9 -10" stroke="#06202a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="rotate(5 1210 280)">
    <rect x="1120" y="190" width="180" height="180" rx="14" fill="url(#cardB)" stroke="#EE1D52" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="1142" y="212" width="136" height="88" rx="8" fill="#EE1D52" opacity="0.18"/>
    <rect x="1142" y="316" width="96" height="10" rx="5" fill="#f8a9bd" opacity="0.65"/>
    <rect x="1142" y="336" width="60" height="10" rx="5" fill="#EE1D52" opacity="0.5"/>
    <!-- heart -->
    <path d="M1252 334 c-5 -8 -18 -6 -18 4 c0 8 10 13 18 19 c8 -6 18 -11 18 -19 c0 -10 -13 -12 -18 -4 z" fill="#EE1D52" opacity="0.85"/>
  </g>

  <!-- center: live screen with play -->
  <g>
    <rect x="660" y="170" width="300" height="380" rx="20" fill="url(#screen)" stroke="#9aa6ff" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- LIVE pill -->
    <rect x="684" y="194" width="74" height="28" rx="14" fill="#EE1D52" opacity="0.92"/>
    <circle cx="700" cy="208" r="5" fill="#ffffff"/>
    <rect x="712" y="203" width="36" height="10" rx="3" fill="#ffffff" opacity="0.9"/>
    <!-- viewers pill -->
    <rect x="862" y="194" width="74" height="28" rx="14" fill="#0b1626" stroke="#69C9D0" stroke-opacity="0.5"/>
    <circle cx="880" cy="208" r="6" fill="#69C9D0" opacity="0.8"/>
    <rect x="894" y="203" width="30" height="10" rx="3" fill="#9bdfe4" opacity="0.8"/>
    <!-- play button -->
    <circle cx="810" cy="360" r="52" fill="#03030a" opacity="0.55"/>
    <circle cx="810" cy="360" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M794 334 L 846 360 L 794 386 Z" fill="#ffffff" opacity="0.92"/>
    <!-- bottom product bar -->
    <rect x="684" y="470" width="252" height="58" rx="12" fill="#03030a" opacity="0.7"/>
    <rect x="696" y="482" width="34" height="34" rx="8" fill="#69C9D0" opacity="0.5"/>
    <rect x="742" y="486" width="110" height="10" rx="5" fill="#ffffff" opacity="0.75"/>
    <rect x="742" y="504" width="70" height="9" rx="4.5" fill="#69C9D0" opacity="0.7"/>
    <rect x="862" y="484" width="62" height="30" rx="15" fill="#EE1D52" opacity="0.9"/>
  </g>

  <!-- rising reaction bubbles -->
  <g opacity="0.85">
    <circle cx="1010" cy="430" r="9" fill="#EE1D52" opacity="0.7"/>
    <circle cx="1040" cy="370" r="7" fill="#69C9D0" opacity="0.7"/>
    <circle cx="1020" cy="310" r="5" fill="#ffffff" opacity="0.55"/>
    <circle cx="590" cy="420" r="7" fill="#69C9D0" opacity="0.6"/>
    <circle cx="566" cy="356" r="5" fill="#EE1D52" opacity="0.55"/>
  </g>

  <!-- sparse stars -->
  <g fill="#ffffff">
    <circle cx="140" cy="110" r="1.5" opacity="0.6"/><circle cx="520" cy="70" r="1.3" opacity="0.5"/>
    <circle cx="1060" cy="90" r="1.4" opacity="0.55"/><circle cx="1480" cy="200" r="1.4" opacity="0.6"/>
    <circle cx="180" cy="620" r="1.3" opacity="0.5"/><circle cx="880" cy="640" r="1.4" opacity="0.5"/>
    <circle cx="1380" cy="640" r="1.3" opacity="0.45"/>
  </g>
</svg>
